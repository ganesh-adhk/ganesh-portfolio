<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ganesh Adhikari logo">
  <!-- Background: rounded square, near-black with subtle cyan glow ring -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0d12"/>
      <stop offset="100%" stop-color="#11151c"/>
    </linearGradient>
    <linearGradient id="ga" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#1ddbff"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="12" fill="none"
        stroke="#00d4ff" stroke-opacity="0.35" stroke-width="1"/>

  <!-- Monogram "GA" — bold geometric, optimised for tiny sizes -->
  <g font-family="'Unbounded','Inter',system-ui,sans-serif"
     font-weight="900" font-size="30" letter-spacing="-1.5"
     fill="url(#ga)" text-anchor="middle"
     dominant-baseline="middle">
    <text x="32" y="34">GA</text>
  </g>

  <!-- Signature cyan dot, mirroring the site's "GA." nav logo -->
  <circle cx="52" cy="50" r="3" fill="#00d4ff"/>
</svg>
